<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <pattern id="net" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 5L5 0L10 5L5 10Z" fill="none" stroke="#6c1224" stroke-width="0.6"/>
    </pattern>
    <path id="petal" d="M0-7C13-11 21-27 0-37C-21-27-13-11 0-7Z"/>
    <g id="leaf">
      <path d="M0 0C9-9 25-11 36-3C25 5 9 7 0 0Z" fill="#62101f" stroke="#93354a" stroke-width="0.8"/>
      <path d="M3 0C14-2 24-3 33-3" fill="none" stroke="#93354a" stroke-width="0.5"/>
    </g>
    <g id="rose">
      <g fill="#69132a" fill-opacity="0.9" stroke="#9e3c50" stroke-width="0.8">
        <use xlink:href="#petal"/>
        <use xlink:href="#petal" transform="rotate(60)"/>
        <use xlink:href="#petal" transform="rotate(120)"/>
        <use xlink:href="#petal" transform="rotate(180)"/>
        <use xlink:href="#petal" transform="rotate(240)"/>
        <use xlink:href="#petal" transform="rotate(300)"/>
      </g>
      <g stroke="#86293d" stroke-width="0.6" fill="none">
        <path d="M0-10V-32"/>
        <path d="M0-10V-32" transform="rotate(60)"/>
        <path d="M0-10V-32" transform="rotate(120)"/>
        <path d="M0-10V-32" transform="rotate(180)"/>
        <path d="M0-10V-32" transform="rotate(240)"/>
        <path d="M0-10V-32" transform="rotate(300)"/>
      </g>
      <g fill="#7a1b31" stroke="#b25467" stroke-width="1.3" transform="rotate(30) scale(0.55)">
        <use xlink:href="#petal"/>
        <use xlink:href="#petal" transform="rotate(60)"/>
        <use xlink:href="#petal" transform="rotate(120)"/>
        <use xlink:href="#petal" transform="rotate(180)"/>
        <use xlink:href="#petal" transform="rotate(240)"/>
        <use xlink:href="#petal" transform="rotate(300)"/>
      </g>
      <circle r="6" fill="#4d0915" stroke="#b25467" stroke-width="0.8"/>
      <path d="M0-3a3 3 0 1 1-3 3" fill="none" stroke="#b25467" stroke-width="0.7"/>
      <g fill="#a54a5d">
        <circle cy="-40" r="1.2"/>
        <circle cy="-40" r="1.2" transform="rotate(60)"/>
        <circle cy="-40" r="1.2" transform="rotate(120)"/>
        <circle cy="-40" r="1.2" transform="rotate(180)"/>
        <circle cy="-40" r="1.2" transform="rotate(240)"/>
        <circle cy="-40" r="1.2" transform="rotate(300)"/>
      </g>
    </g>
    <g id="bud">
      <g fill="#65112a" stroke="#9e3c50" stroke-width="0.7">
        <circle cy="-6" r="5"/>
        <circle cy="-6" r="5" transform="rotate(72)"/>
        <circle cy="-6" r="5" transform="rotate(144)"/>
        <circle cy="-6" r="5" transform="rotate(216)"/>
        <circle cy="-6" r="5" transform="rotate(288)"/>
      </g>
      <circle r="2.6" fill="#a54a5d"/>
    </g>
    <g id="corner">
      <use xlink:href="#leaf" transform="rotate(20) translate(9 0) scale(0.55)"/>
      <use xlink:href="#leaf" transform="rotate(200) translate(9 0) scale(0.55)"/>
      <use xlink:href="#bud"/>
    </g>
  </defs>

  <rect width="160" height="160" fill="#560b19"/>
  <rect width="160" height="160" fill="url(#net)"/>

  <g transform="translate(80 80)">
    <use xlink:href="#leaf" transform="rotate(30) translate(30 0)"/>
    <use xlink:href="#leaf" transform="rotate(120) translate(30 0)"/>
    <use xlink:href="#leaf" transform="rotate(210) translate(30 0)"/>
    <use xlink:href="#leaf" transform="rotate(300) translate(30 0)"/>
    <use xlink:href="#rose"/>
  </g>

  <use xlink:href="#corner" x="0" y="0"/>
  <use xlink:href="#corner" x="160" y="0"/>
  <use xlink:href="#corner" x="0" y="160"/>
  <use xlink:href="#corner" x="160" y="160"/>
</svg>
